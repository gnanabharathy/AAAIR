tools_not_recommended: "Also assessed but not recommended for the VRE: Bioconductor (covered through R), WGCNA, EpiSurv, Tableau, Snakemake, Nexa AI, Vertex AI, GitHub Copilot, Google Antigravity, Grok, NotebookLM, OpenDataFit, Llama, Ollama and Singularity/Apptainer (left to the VRE team), Perplexity, Microsoft 365 Copilot, OpenAI Platform, SPSS and Excel."

