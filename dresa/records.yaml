# matching `xlsx` against its `tool` column; a `training` value here overrides it.
tool_categories:
  - Programming languages
  - IDEs and notebook environments
  - Low-code and visual analytics
  - Commercial statistical software
  - Web-based domain platforms
  - Databases
  - Version control and collaboration
  - Business intelligence
  - Generative AI assistants

tools:
