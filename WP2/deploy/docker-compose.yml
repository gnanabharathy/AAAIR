# Open Healthcare Dataset Explorer (AAAIR WP2), served behind Caddy.
#
# Run from WP2/deploy:
#
#   docker compose up -d --build
#
# With SITE_ADDRESS unset, Caddy serves plain HTTP on port 80. Set it to a DNS
# name that points at this host and Caddy obtains and renews a Let's Encrypt
# certificate automatically:
#
#   SITE_ADDRESS=explorer.<your-project-zone>.cloud.edu.au docker compose up -d
#
# Note: WP2/docker-compose.yml is a different file. That one runs the
# PostgreSQL OMOP CDM database used by the ETL and DQD pipeline.

services:
  explorer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aaair-explorer:latest
    restart: unless-stopped
    # No published ports: only Caddy can reach the app.
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      explorer:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume forces re-issuance, and
      # Let's Encrypt rate-limits repeated issuance for the same name.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
